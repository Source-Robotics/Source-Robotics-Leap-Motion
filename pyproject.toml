[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "source-robotics-leap-motion"
version = "0.1.0b1"
description = "Modern Leap Motion tracking and configurable robot-arm teleoperation primitives"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Source Robotics"}]
dependencies = [
    "websocket-client>=1.8,<2",
    "typing-extensions>=4.4; python_version < '3.11'",
    "tomli>=2; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.14"]

[project.urls]
Homepage = "https://github.com/Source-Robotics/Source-Robotics-Leap-Motion"
Documentation = "https://github.com/Source-Robotics/Source-Robotics-Leap-Motion#readme"
Issues = "https://github.com/Source-Robotics/Source-Robotics-Leap-Motion/issues"
Releases = "https://github.com/Source-Robotics/Source-Robotics-Leap-Motion/releases"

[project.scripts]
source-leap = "source_robotics_leap_motion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/source_robotics_leap_motion"]

[tool.hatch.build]
exclude = ["**/*.dll", "**/*.pyd", "**/*.exe", "**/*.ldat", "**/runtime-manifest.json"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/tools", "/docs", "/README.md", "/PACKAGE_DESIGN.md", "/LICENSE", "/pyproject.toml", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

